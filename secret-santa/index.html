<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Evil Santa's Dungeon — Secret Santa</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1b2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1c2c; --paper:#f8f4e6; --red:#c8283c; --green:#2f8f4e; --gold:#f2c14e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0d1b2a; color:var(--paper);
    font-family:'Press Start 2P', ui-monospace, monospace; overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none; }
  body { display:flex; justify-content:center; }
  #app { position:relative; width:100%; max-width:540px; height:100%; display:flex; flex-direction:column; }
  #screen { position:relative; width:100%; aspect-ratio:12/11; background:#000; border-bottom:4px solid #000; flex:none; overflow:hidden; }
  canvas#game { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

  #hud { position:absolute; left:2%; top:2%; padding:6px 8px 7px; background:rgba(14,16,30,.72); border:2px solid rgba(248,244,230,.85);
    border-radius:6px; font-size:clamp(7px,2vw,10px); line-height:1.7; display:none; min-width:38%; backdrop-filter:blur(2px); }
  #hud .floorname { color:var(--gold); }
  #hud .hp { position:relative; height:11px; background:#2a1420; border:2px solid #000; border-radius:3px; margin:4px 0 5px; overflow:hidden; }
  #hud .hp i { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(#ff6b7a,#d63a3a 60%,#9e1f2e); transition:width .2s; }
  #hud .hp b { position:absolute; inset:0; text-align:center; font-weight:normal; font-size:7px; line-height:8px; color:#fff; text-shadow:1px 1px 0 #000; }
  #hud .pips { letter-spacing:1px; }
  #hud .pips em { font-style:normal; color:#7fd3ff; }
  #mute { position:absolute; right:2%; top:2%; font:inherit; font-size:10px; background:rgba(14,16,30,.72); color:var(--paper);
    border:2px solid rgba(248,244,230,.85); border-radius:6px; padding:5px 6px; cursor:pointer; display:none; }

  #bossbar { position:absolute; left:8%; right:8%; bottom:3%; display:none; text-align:center; font-size:clamp(7px,2.1vw,10px);
    color:#fff; text-shadow:2px 2px 0 #000; }
  #bossbar .bb { height:12px; margin-top:5px; background:#1a0a10; border:2px solid #000; border-radius:3px; box-shadow:0 0 0 2px rgba(255,255,255,.6); overflow:hidden; }
  #bossbar .bb i { display:block; height:100%; width:100%; background:linear-gradient(#ffd36b,#f2a12e 50%,#c8283c); transition:width .25s; }

  #banner { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; opacity:0; transform:scale(.9);
    transition:opacity .35s, transform .35s; text-shadow:3px 3px 0 #000; }
  #banner.show { opacity:1; transform:scale(1); }
  #banner .bt { font-size:clamp(14px,4.6vw,22px); color:var(--gold); }
  #banner .bs { font-size:clamp(7px,2.2vw,10px); color:#fff; margin-top:10px; }

  #controls { flex:1; position:relative; display:flex; align-items:center; justify-content:space-between; padding:10px 22px 22px; min-height:160px;
    background:radial-gradient(120% 90% at 50% 0%, #1d3350, #0d1b2a 70%); }
  .dpad { position:relative; width:144px; height:144px; touch-action:none; }
  .dpad span { position:absolute; width:48px; height:48px; background:#2b2d42; color:#8d99ae; font-size:14px; border-radius:8px;
    box-shadow:0 4px 0 #111, inset 0 2px 0 rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .dpad span.on { transform:translateY(3px); box-shadow:0 1px 0 #111; background:#3a3d5c; color:#fff; }
  .dpad .u { left:48px; top:0; } .dpad .d { left:48px; bottom:0; } .dpad .l { left:0; top:48px; } .dpad .r { right:0; top:48px; }
  .dpad .c { left:48px; top:48px; box-shadow:none; border-radius:0; }
  .btns { position:relative; width:170px; height:144px; }
  .btns button { position:absolute; border:none; border-radius:50%; color:#fff; font:inherit; cursor:pointer; touch-action:none; }
  .btns button:active, .btns button.on { transform:translateY(4px); }
  .abtn { width:80px; height:80px; right:0; top:34px; background:radial-gradient(circle at 35% 30%, #ff6b7a, var(--red) 60%); font-size:16px; box-shadow:0 5px 0 #6e0f1d; }
  .bbtn { width:60px; height:60px; left:14px; top:68px; background:radial-gradient(circle at 35% 30%, #8fd6ff, #2f6fd6 60%); font-size:9px; box-shadow:0 5px 0 #173a78; }
  .cbtn { width:44px; height:44px; left:40px; top:6px; background:radial-gradient(circle at 35% 30%, #e0b07a, #8a5a2b 60%); font-size:14px; box-shadow:0 4px 0 #4a2c12; }
  .btns small { position:absolute; font-size:6px; color:#7a8aa0; }
  .hint { position:absolute; bottom:5px; left:0; right:0; text-align:center; font-size:6px; color:#5c6b80; line-height:1.6; }

  .overlay { position:absolute; inset:0; z-index:20; display:none; overflow-y:auto; background:#0d1b2a; padding:18px 14px 30px; }
  .overlay.show { display:block; }
  .snow { position:fixed; inset:0; pointer-events:none; background-image:
      radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent 51%), radial-gradient(2px 2px at 90px 120px,#fff 50%,transparent 51%),
      radial-gradient(3px 3px at 160px 60px,#dfefff 50%,transparent 51%), radial-gradient(2px 2px at 220px 170px,#fff 50%,transparent 51%),
      radial-gradient(2px 2px at 60px 210px,#fff 50%,transparent 51%), radial-gradient(3px 3px at 280px 20px,#fff 50%,transparent 51%);
    background-size:300px 240px; animation:snow 9s linear infinite; opacity:.55; }
  @keyframes snow { to { background-position:40px 240px, -30px 240px, 20px 240px, -20px 240px, 30px 240px, -40px 240px; } }

  #title { background:radial-gradient(circle at 50% 18%, #3b1622, #0d1b2a 62%); }
  .santa-art { display:block; width:112px; height:112px; margin:4px auto 0; image-rendering:pixelated; filter:drop-shadow(0 0 10px rgba(255,59,59,.55));
    animation:hover 2.4s ease-in-out infinite; }
  @keyframes hover { 50% { transform:translateY(-6px); filter:drop-shadow(0 0 18px rgba(255,59,59,.85)); } }
  h1.title { text-align:center; font-size:clamp(15px,5vw,24px); line-height:1.45; margin:8px 0 4px; color:var(--red);
    text-shadow:3px 3px 0 #000, -1px -1px 0 #fff; }
  h1.title span { display:block; color:var(--gold); font-size:.62em; margin-top:6px; }
  .sub { text-align:center; font-size:clamp(7px,2.2vw,10px); line-height:1.9; color:#c9d6e3; margin:10px 4px 16px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; position:relative; }
  .card { position:relative; background:linear-gradient(#22385a,#1b2b40); border:3px solid #33506f; border-radius:8px; padding:8px 4px 8px; text-align:center;
    cursor:pointer; font:inherit; color:var(--paper); transition:transform .12s, border-color .12s; }
  .card:hover:not(:disabled) { border-color:var(--gold); transform:translateY(-3px); }
  .card canvas { width:64px; height:64px; image-rendering:pixelated; display:block; margin:0 auto 6px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
  .card .nm { font-size:clamp(8px,2.4vw,11px); }
  .card .cl { font-size:6px; color:#9fb3c8; margin-top:6px; line-height:1.6; min-height:20px; }
  .card:disabled { cursor:not-allowed; filter:grayscale(1); opacity:.55; }
  .mrscard { display:flex; align-items:center; gap:14px; width:100%; margin-top:16px; padding:10px 14px; text-align:left; border-color:#f2c14e;
    background:linear-gradient(#5a1a22,#2a0e16); }
  .mrscard canvas { margin:0; flex:none; }
  .mrscard .cl { min-height:0; font-size:7px; color:#f2d6a0; }
  .mrscard .tag { font-size:7px; color:#f2c14e; margin-top:6px; }
  .leader { margin-top:10px; background:#1b2b40; border:3px solid #33506f; border-radius:6px; padding:10px 12px; font-size:8px; line-height:2; }
  .leader:empty { display:none; }
  .leader .lbh { color:#f2c14e; margin-bottom:4px; }
  .leader .lbr { display:flex; justify-content:space-between; color:#c9d6e3; }
  .leader .lbr.first { color:#fff; }
  .leader .lbe { color:#9fb3c8; }
  .whogrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px; }
  .whobtn { font:inherit; font-size:8px; padding:10px 2px; color:#fff; background:#2a3d57; border:2px solid #556b84; border-radius:5px; cursor:pointer; }
  .whobtn:hover { border-color:#f2c14e; }
  .card .lock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .card .lock b { background:var(--red); color:#fff; font-size:8px; padding:5px 6px; border:2px solid #fff; transform:rotate(-12deg); }
  .loading { text-align:center; font-size:9px; color:#9fb3c8; margin:30px 0; line-height:2; }
  .panel { background:#1b2b40; border:3px solid #33506f; border-radius:8px; padding:16px; margin:14px 0; font-size:clamp(7px,2.3vw,10px); line-height:2; }
  .panel b { color:var(--gold); font-weight:normal; }
  .big { display:block; width:100%; margin-top:14px; padding:14px; font:inherit; font-size:clamp(9px,2.8vw,12px); color:#fff; background:var(--green);
    border:3px solid #fff; border-radius:6px; cursor:pointer; box-shadow:0 5px 0 #0c3d1e; }
  .big:active { transform:translateY(3px); box-shadow:0 2px 0 #0c3d1e; }
  .big.red { background:var(--red); box-shadow:0 5px 0 #6e0f1d; }
  .big.ghost { background:transparent; box-shadow:none; border-color:#556b84; color:#9fb3c8; }
  .hero-row { display:flex; gap:14px; align-items:center; }

  #reveal { background:radial-gradient(circle at 50% 40%, #3b1d2e, #0d1b2a 70%); }
  .scroll { margin:20px auto 0; max-width:380px; background:#f3e3b5; color:#4a2c12; border:4px solid #8a5a2b; border-radius:6px;
    padding:22px 16px; text-align:center; box-shadow:0 0 0 4px #d8bd7a, 0 10px 30px rgba(0,0,0,.6); font-size:clamp(8px,2.4vw,11px); line-height:2; }
  .scroll .who { font-size:clamp(20px,8vw,34px); color:var(--red); margin:18px 0 10px; text-shadow:2px 2px 0 #e8c98a; animation:pop .9s ease-out; }
  @keyframes pop { 0% { transform:scale(.2); opacity:0; } 70% { transform:scale(1.15); opacity:1; } 100% { transform:scale(1); } }
  .warn { color:var(--red); }
  .ash { text-align:center; font-size:11px; line-height:2.2; margin-top:60px; }
</style>
</head>
<body>
<div class="snow"></div>
<div id="app">

    <canvas id="game" width="576" height="528"></canvas>

  </div>
  <div id="controls">

    <h1 class="title">EVIL SANTA'S DUNGEON<span>~ Secret Santa Edition ~</span></h1>
    <p class="sub">Pick your name, fight through 3 floors, and beat Evil Santa to see who you're shopping for.</p>
    <div id="cards"><div class="loading">Checking the naughty list...</div></div>
  </div>
  <div id="confirm" class="overlay"></div>
  <div id="reveal" class="overlay"></div>
</div>

function makeSprite(grid, pal){
  const h = grid.length, w = grid[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  grid.forEach((row, y) => { for (let i = 0; i < w; i++){ const ch = row[i] || '.'; if (ch === '.' || !pal[ch]) continue; x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } });
  return c;
}
function flipped(src){ const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c; }
function tinted(src, color){ const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const x = c.getContext('2d');
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height); return c; }
function spriteSet(src){ const l = flipped(src); return { r:src, l, wr:tinted(src, '#ffffff'), wl:tinted(l, '#ffffff'), ir:tinted(src, '#9fdcff'), il:tinted(l, '#9fdcff') }; }

  ctx:null, muted:false,
  unlock(){ if (!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d, type='square', v=.04, when=0, slide=0){
    if (this.muted || !this.ctx) return; const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
  seq(notes, step=.14, type='square'){ notes.forEach((n,i) => n && this.tone(n, step*.9, type, .045, i*step)); },
  blip(){ this.tone(880,.05); }, bump(){ this.tone(120,.08,'square',.05); },
  swing(){ this.tone(520,.07,'triangle',.035,0,.45); },

const held = { up:false, down:false, left:false, right:false };

const padDirs = { up:false, down:false, left:false, right:false };
const btn = { atkKey:false, atkPad:false, spQueued:false, cocoaQueued:false };
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
function syncHeld(){ for (const k in held) held[k] = keyDirs[k] || padDirs[k]; }
addEventListener('keydown', e => {

  if (k === ' ' || k === 'j' || k === 'z' || k === 'enter'){ e.preventDefault(); btn.atkKey = true; }
  else if ((k === 'k' || k === 'x') && !e.repeat) btn.spQueued = true;
  else if ((k === 'l' || k === 'c') && !e.repeat) btn.cocoaQueued = true;
});
addEventListener('keyup', e => {

  const k = e.key.toLowerCase(); if (k === ' ' || k === 'j' || k === 'z' || k === 'enter') btn.atkKey = false;
});

// Touch d-pad: slide your thumb anywhere on it, diagonals included
const dpad = document.getElementById('dpad');
const padSpans = { up:dpad.querySelector('.u'), down:dpad.querySelector('.d'), left:dpad.querySelector('.l'), right:dpad.querySelector('.r') };
let padPointer = null;
function padFrom(e){
  const r = dpad.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const dead = r.width*.12, d = Math.hypot(dx, dy);
  for (const k in padDirs) padDirs[k] = false;
  if (d > dead){ const a = Math.atan2(dy, dx); const cx = Math.cos(a), cy = Math.sin(a);
    if (cx > .38) padDirs.right = true; if (cx < -.38) padDirs.left = true; if (cy > .38) padDirs.down = true; if (cy < -.38) padDirs.up = true; }
  for (const k in padSpans) padSpans[k].classList.toggle('on', padDirs[k]);
  syncHeld();
}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); Snd.unlock(); padPointer = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch(_){} padFrom(e); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === padPointer) padFrom(e); });
const padOff = e => { if (e.pointerId !== padPointer) return; padPointer = null; for (const k in padDirs) padDirs[k] = false; for (const k in padSpans) padSpans[k].classList.remove('on'); syncHeld(); };
dpad.addEventListener('pointerup', padOff); dpad.addEventListener('pointercancel', padOff);
function holdButton(el, down, up){
  el.addEventListener('pointerdown', e => { e.preventDefault(); Snd.unlock(); el.classList.add('on'); down(); });
  const off = e => { e.preventDefault(); el.classList.remove('on'); if (up) up(); };
  el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}

/* ---------- Locks ---------- */
const LOCAL_KEY = 'krampus-santa-locks-v1';
const Lock = {
  local(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch(e){ return []; } },
  async list(){
    if (!LOCK_API) return this.local();
    const r = await fetch(LOCK_API.replace(/\/$/,'') + '/locks', { cache:'no-store' });
    if (!r.ok) throw new Error('bad'); const j = await r.json(); return Array.isArray(j.locked) ? j.locked : [];
  },
  async claim(name){ // resolves 'ok' | 'locked'
    if (!LOCK_API){
      const l = this.local(); if (l.includes(name)) return 'locked';
      l.push(name); try { localStorage.setItem(LOCAL_KEY, JSON.stringify(l)); } catch(e){} return 'ok';
    }
    const r = await fetch(LOCK_API.replace(/\/$/,'') + '/lock', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ name }) });
    if (r.status === 409) return 'locked'; if (!r.ok) throw new Error('bad'); return 'ok';
  },
};

/* ---------- Helpers ---------- */
const rand = (a, b) => a + Math.random()*(b - a);
function dmgCalc(atk, mult, def, pierce=false){ return Math.max(1, Math.round(atk*mult*rand(.85,1.15) - (pierce ? 0 : def*.6))); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rp = v => Math.round(v*SC)/SC;   // snap to a screen pixel
function hash(x, y){ return ((x*73856093) ^ (y*19349663)) >>> 0; }
function angDiff(a, b){ let d = a - b; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return Math.abs(d); }

const fx = { shake:0, hitstop:0, slow:0, fade:0, fadeDir:0, redFlash:0 };
let cam = { x:0, y:0 };

function newRun(pi, save){
  const p = PLAYERS[pi], ab = p.mrs ? (save ? save.ab : mrsPending) : p.name, ap = PLAYERS.find(q => q.name === ab);
  G = { pi, p, ab, ap, lives:3, mv:MOVES[ab], maxHp:p.hp, hp:p.hp, atk:p.atk, def:p.def, spd:p.spd, spMax:p.sp, sp:p.sp, cocoa:2, hasKey:false, spirit:0,
        floor:0, x:0, y:0, hw:5, hh:8, vx:0, vy:0, kbx:0, kby:0, face:{ x:1, y:0 }, dirLR:'r', inv:0, atkCd:0, cocoaCd:0, walkT:0, moving:false,
        grid:null, layer:null, enemies:[], shots:[], eshots:[], hazards:[], allies:[], pickups:[], parts:[], texts:[], rings:[], swing:null,
        bossDown:[], cp:null, boss:null, msgCd:0, time:0 };
  if (p.mrs && save) Object.assign(G, { maxHp:save.maxHp, hp:save.maxHp, atk:save.atk, def:save.def, spMax:save.spMax, sp:save.spMax, cocoa:save.cocoa, lives:save.lives,
    who:save.who || null, run:save.run || null, reported:save.reported || 0 });
  else if (p.mrs){ G.who = mrsWho; G.run = newRunId(); G.reported = 0; }
}
function spawnEnemy(type, x, y, extra){
  const d = MON[type], sc = d.scale || 1, w = SPR[d.spr][0].length;
  const e = Object.assign({ type, x, y, sx:x, sy:y, hp:d.hp, maxHp:d.hp, hw:Math.round(w*sc*.32), hh:Math.round(w*sc*.55), sc,
    alive:true, t:Math.random()*3, cd:rand(.6, 1.6), vx:0, vy:0, kbx:0, kby:0, flash:0, stun:0, frozen:0, weak:false, aggro:false,
    state:'idle', st:0, z:0, air:false, active:!d.boss, boss:!!d.boss, wander:{ x:0, y:0, t:0 }, dirLR:'l', atk:d.atk, def:d.def, rate:1, bspd:1, alpha:1 }, extra || {});
  if (G.p && G.p.mrs && G.floor >= 3){   // Mrs Claus deep floors: everything scales up, fast
    const k = G.floor - 3, n = G.floor, pAtk = 11 + 3*n;
    const hits = d.boss ? 40 + 6*k : (3 + .3*k)*(d.hp/30);
    e.hp = e.maxHp = Math.round(hits*pAtk*.9);
    e.atk = Math.round(((.18 + .022*k)*(58 + 12*n) + .6*(4 + n))*(d.atk/11)*(d.boss ? 1.12 : 1));
    e.def = d.def + .5*k; e.rate = (1 + .045*k)*(d.fast || 1); e.bspd = 1 + .035*k;
  }
  G.enemies.push(e); return e;
}
function loadFloor(n){
  G.floor = n; const f = FLOORS[n];
  G.grid = f.map.map(r => r.split('')); G.hasKey = n === 0 ? false : G.hasKey;
  if (G.p.mrs) G.grid.forEach(row => row.forEach((c, x) => { if (c === 'F') row[x] = '.'; }));   // no healing fireplaces for Mrs Claus
  G.enemies = []; G.shots = []; G.eshots = []; G.hazards = []; G.allies = []; G.pickups = []; G.parts = []; G.texts = []; G.rings = []; G.swing = null; G.boss = null;
  G.grid.forEach((row, y) => row.forEach((c, x) => {
    if (c === '@'){ G.x = x*TS + 8; G.y = y*TS + 13; row[x] = '.'; }
    else if (c === 'M'){ spawnEnemy(f.mons[(x*7 + y*3) % f.mons.length], x*TS + 8, y*TS + 13); row[x] = '.'; }
    else if (c >= '1' && c <= '3'){ spawnEnemy(f.mons[(+c - 1) % f.mons.length], x*TS + 8, y*TS + 13); row[x] = '.'; }
    else if (c === 'B'){ G.boss = spawnEnemy(f.boss, x*TS + 8, y*TS + 13); row[x] = '.'; }
  }));
  G.cp = { x:G.x, y:G.y }; G.vx = G.vy = G.kbx = G.kby = 0;
  G.layer = buildLayer();
  cam.x = clamp(G.x - VW/2, 0, G.grid[0].length*TS - VW); cam.y = clamp(G.y - 8 - VH/2, 0, G.grid.length*TS - VH);
  hideBossBar();
}

/* ---------- Tiles + collision ---------- */
const tileAt = (gx, gy) => (G.grid[gy] && G.grid[gy][gx]) || '#';
function solidTile(c, who){
  if (c === '.' || c === '=' || c === '_') return false;
  if (c === '~') return !(who === 'fly' || who === 'shot');
  if (c === 'S') return who === 'hero' ? !G.bossDown[G.floor] : who !== 'shot';
  return true;
}
function boxSolid(x, y, hw, hh, who){
  const x0 = Math.floor((x - hw)/TS), x1 = Math.floor((x + hw - .01)/TS), y0 = Math.floor((y - hh)/TS), y1 = Math.floor((y - .01)/TS);
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) if (solidTile(tileAt(gx, gy), who)) return true;
  return false;
}
function moveBody(b, dx, dy, who){
  let hx = false, hy = false;
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))/3)), sx = dx/n, sy = dy/n;
  for (let i = 0; i < n; i++){
    if (sx && !hx){ b.x += sx; if (boxSolid(b.x, b.y, b.hw, b.hh, who)){ b.x -= sx; hx = true; } }
    if (sy && !hy){ b.y += sy; if (boxSolid(b.x, b.y, b.hw, b.hh, who)){ b.y -= sy; hy = true; } }
  }
  return { hx, hy };
}
// Slide around corners so 1-tile doorways are easy to hit
function cornerAssist(b, dx, dy, who){
  if (dx && !dy){ for (let k = 1; k <= 6; k++) for (const s of [-1, 1]) if (!boxSolid(b.x + Math.sign(dx)*2, b.y + s*k, b.hw, b.hh, who) && !boxSolid(b.x, b.y + s*Math.min(k, 1.2), b.hw, b.hh, who)){ b.y += s*Math.min(k, 1.2); return; } }
  if (dy && !dx){ for (let k = 1; k <= 6; k++) for (const s of [-1, 1]) if (!boxSolid(b.x + s*k, b.y + Math.sign(dy)*2, b.hw, b.hh, who) && !boxSolid(b.x + s*Math.min(k, 1.2), b.y, b.hw, b.hh, who)){ b.x += s*Math.min(k, 1.2); return; } }
}
const center = e => ({ x:e.x, y:e.y - e.hh/2 });
function overlap(a, b){ return Math.abs(a.x - b.x) < a.hw + b.hw && (a.y - a.hh) < b.y && (b.y - b.hh) < a.y; }

/* ---------- HUD ---------- */
const hudEl = document.getElementById('hud');
let hudCache = '';
function updateHud(){
  if (!G) return;
  const pct = Math.max(0, G.hp/G.maxHp)*100;
  const html = `<span class="floorname">F${G.floor+1} ${FLOORS[G.floor].short}</span>${G.spirit ? ' ✨' + G.spirit : ''}${G.p.mrs ? ' ❤' + G.lives : ''}
    <div class="hp"><i style="width:${pct.toFixed(1)}%"></i><b>${Math.max(0, Math.ceil(G.hp))}/${G.maxHp}</b></div>
    <span class="pips"><em>✦</em>${G.sp}/${G.spMax} ☕${G.cocoa}${G.hasKey ? ' 🗝' : ''}</span>`;
  if (html !== hudCache){ hudEl.innerHTML = html; hudCache = html; }
}
function showHud(on){ hudEl.style.display = on ? 'block' : 'none'; muteBtn.style.display = on ? 'block' : 'none'; }
const bossBar = document.getElementById('bossbar'), bossFill = document.getElementById('bossFill');
function showBossBar(e){ document.getElementById('bossName').textContent = MON[e.type].name; bossBar.style.display = 'block'; bossFill.style.width = '100%'; }
function hideBossBar(){ bossBar.style.display = 'none'; }
const bannerEl = document.getElementById('banner'); let bannerTimer = null;
function banner(t, s='', ms=2000){
  document.getElementById('bannerT').textContent = t; document.getElementById('bannerS').textContent = s;
  bannerEl.classList.add('show'); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), ms);
}
function floatText(x, y, text, color='#fff', big=false){ G.texts.push({ x, y, text, color, big, t:0, dur:big ? 1.1 : .8 }); }

/* ---------- Effects ---------- */
function burst(x, y, n, colors, o={}){
  for (let i = 0; i < n; i++){
    const a = o.angle !== undefined ? o.angle + rand(-o.spread, o.spread) : rand(0, Math.PI*2), sp = rand(o.min || 20, o.max || 90);
    G.parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (o.up || 0), g:o.g ?? 140, drag:o.drag ?? 2.5, life:rand(.35, o.life || .8), t:0,
      c:colors[(Math.random()*colors.length)|0], s:o.size ? rand(o.size*.6, o.size) : rand(1, 2.4), glow:!!o.glow });
  }
}
function shake(n){ fx.shake = Math.max(fx.shake, n); }
function ring(x, y, r0, r1, dur, color){ G.rings.push({ x, y, r0, r1, t:0, dur, color }); }

/* ---------- Player ---------- */
function heroUpdate(dt){
  let ix = 0, iy = 0;
  if (held.left) ix--; if (held.right) ix++; if (held.up) iy--; if (held.down) iy++;
  const len = Math.hypot(ix, iy);
  if (len){ ix /= len; iy /= len; G.face = { x:ix, y:iy }; if (Math.abs(ix) > .1) G.dirLR = ix > 0 ? 'r' : 'l'; }
  const onIce = tileAt(Math.floor(G.x/TS), Math.floor((G.y - 3)/TS)) === '_';
  const spd = 60 + G.spd*3.2;
  const k = 1 - Math.exp(-(onIce ? 1.8 : 16)*dt);
  G.vx += (ix*spd - G.vx)*k; G.vy += (iy*spd - G.vy)*k;
  const dx = (G.vx + G.kbx)*dt, dy = (G.vy + G.kby)*dt;
  const hit = moveBody(G, dx, dy, 'hero');
  if (hit.hx){ if (onIce && Math.abs(G.vx) > 30) Snd.bump(); G.vx = 0; G.kbx = 0; if (len) cornerAssist(G, ix, iy, 'hero'); }
  if (hit.hy){ if (onIce && Math.abs(G.vy) > 30) Snd.bump(); G.vy = 0; G.kby = 0; if (len) cornerAssist(G, ix, iy, 'hero'); }
  const kd = Math.exp(-10*dt); G.kbx *= kd; G.kby *= kd;
  G.moving = Math.hypot(G.vx, G.vy) > 12;
  if (G.moving){ G.walkT += dt; if (onIce && Math.random() < .25) burst(G.x + rand(-3,3), G.y, 1, ['#ffffff','#dff3ff'], { min:5, max:15, g:-10, life:.4 }); }
  G.inv = Math.max(0, G.inv - dt); G.atkCd -= dt; G.cocoaCd -= dt; G.msgCd -= dt;

  if ((btn.atkKey || btn.atkPad) && G.atkCd <= 0) heroAttack();
  if (btn.spQueued){ btn.spQueued = false; if (G.sp > 0){ G.sp--; heroSpecial(); } else { floatText(G.x, G.y - 20, 'NO SPECIALS', '#9fb3c8'); Snd.bump(); } }
  if (btn.cocoaQueued){ btn.cocoaQueued = false;
    if (G.cocoa > 0 && G.hp < G.maxHp && G.cocoaCd <= 0){ G.cocoa--; G.cocoaCd = .8; const h = Math.round(G.maxHp*.6); G.hp = Math.min(G.maxHp, G.hp + h);
      Snd.heal(); floatText(G.x, G.y - 20, '+' + h, '#7dff9a', true); burst(G.x, G.y - 8, 14, ['#7dff9a','#ffffff','#c98a4b'], { min:10, max:40, g:-40, glow:true }); }
    else Snd.bump(); }
  touchTiles();
  // pickups
  for (const p of G.pickups){ if (p.dead) continue; p.t += dt;
    if (Math.hypot(p.x - G.x, p.y - G.y + 4) < 10){ p.dead = true; const h = G.p.mrs ? Math.max(10, Math.round(G.maxHp*.08)) : 10; G.hp = Math.min(G.maxHp, G.hp + h); Snd.pop(); floatText(p.x, p.y - 10, '+' + h, '#7dff9a'); burst(p.x, p.y - 4, 8, ['#ff8fb1','#fff'], { min:10, max:40, g:-20 }); } }
  G.pickups = G.pickups.filter(p => !p.dead && p.t < 14);
}
function touchTiles(){
  const x0 = Math.floor((G.x - G.hw - 3)/TS), x1 = Math.floor((G.x + G.hw + 3)/TS), y0 = Math.floor((G.y - G.hh - 3)/TS), y1 = Math.floor((G.y + 3)/TS);
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++){
    const c = tileAt(gx, gy), tx = gx*TS + 8, ty = gy*TS + 8;
    if (c === 'C'){ G.grid[gy][gx] = 'o'; G.cocoa += 2; Snd.heal(); floatText(tx, ty - 8, '+2 COCOA', '#f2c14e', true); burst(tx, ty, 16, ['#f2c14e','#ffffff','#c98a4b'], { min:20, max:70, up:40, glow:true }); G.layer = buildLayer(); }
    else if (c === 'K'){ G.grid[gy][gx] = 'o'; G.hasKey = true; Snd.heal(); floatText(tx, ty - 8, 'KEY!', '#ffe14d', true); burst(tx, ty, 20, ['#ffe14d','#ffffff','#d63a3a'], { min:20, max:80, up:40, glow:true }); G.layer = buildLayer(); }
    else if (c === 'L'){
      if (G.hasKey){ G.grid[gy][gx] = '.'; G.hasKey = false; Snd.stairs(); burst(tx, ty, 24, ['#f4f4f4','#d63a3a','#3fa34d'], { min:20, max:80 }); G.layer = buildLayer(); }
      else if (G.msgCd <= 0){ G.msgCd = 1.5; Snd.bump(); floatText(tx, ty - 10, 'LOCKED', '#ff9a9a'); }
    }
    else if (c === 'F'){
      if (G.hp < G.maxHp || G.sp < G.spMax || Math.hypot(G.cp.x - G.x, G.cp.y - G.y) > 24){
        G.hp = G.maxHp; G.sp = G.spMax; G.cp = { x:G.x, y:G.y }; Snd.heal();
        floatText(tx, ty - 12, 'RESTORED', '#ffcf7a', true); burst(G.x, G.y - 8, 18, ['#ffcf7a','#ff8a1f','#ffffff'], { min:10, max:50, g:-60, glow:true });
      }
    }
  }
  const sc = tileAt(Math.floor(G.x/TS), Math.floor((G.y - 4)/TS));
  if (sc === 'S' && G.bossDown[G.floor] && mode === 'play') nextFloor();
}
function aimDir(range, cone){
  let best = null, bs = 1e9; const hx = G.x, hy = G.y - 6;
  for (const e of G.enemies){
    if (!e.alive || e.air) continue; const c = center(e), dx = c.x - hx, dy = c.y - hy, d = Math.hypot(dx, dy);
    if (d > range || d < .01) continue; const dot = (dx*G.face.x + dy*G.face.y)/d; if (dot < cone) continue;
    const s = d*(2 - dot); if (s < bs){ bs = s; best = { x:dx/d, y:dy/d }; }
  }
  return best || { x:G.face.x, y:G.face.y };
}
function heroAttack(){
  const mv = G.mv; G.atkCd = mv.cd;
  if (mv.type === 'melee'){
    const a = aimDir(mv.range + 22, .25); if (Math.abs(a.x) > .1) G.dirLR = a.x > 0 ? 'r' : 'l';
    G.swing = { t:0, dur:.16, ang:Math.atan2(a.y, a.x), arc:mv.arc, range:mv.range, mult:mv.mult, kb:mv.kb, color:mv.color, hit:new Set() };
    Snd.swing();
  } else {
    const a = aimDir(150, .45); if (Math.abs(a.x) > .1) G.dirLR = a.x > 0 ? 'r' : 'l';
    const n = mv.spread || 1, base = Math.atan2(a.y, a.x);
    for (let i = 0; i < n; i++){ const ang = base + (i - (n - 1)/2)*(mv.angle || 0); fireShot(mv.shot, ang); }
    Snd.shoot();
  }
}
function fireShot(s, ang, extra){
  const o = Object.assign({}, s, extra || {});
  G.shots.push(Object.assign(o, { x:G.x + Math.cos(ang)*6, y:G.y - 7 + Math.sin(ang)*6, vx:Math.cos(ang)*o.speed, vy:Math.sin(ang)*o.speed, t:0, ang, hit:new Set() }));
}
function heroSpecial(){
  const p = G.ap, a = aimDir(160, .2), base = Math.atan2(a.y, a.x), hx = G.x, hy = G.y - 6;
  banner(p.spName.toUpperCase(), '', 900);
  switch (G.ab){
    case 'David':
      G.swing = { t:0, dur:.32, ang:base, arc:Math.PI*2, range:34, mult:2.0, kb:230, color:'#ffe14d', hit:new Set(), spin:true };
      shake(8); Snd.swing(); Snd.tone(330,.25,'sawtooth',.05,.05,.5); break;
    case 'Juli':
      for (let i = 0; i < 14; i++) fireShot({ kind:'shard', speed:165, r:4, life:.62, mult:1.1, color:'#bfe6ff', freeze:.65, pierce:true }, i*Math.PI*2/14);
      burst(hx, hy, 30, ['#bfe6ff','#ffffff','#7fd3ff'], { min:30, max:110, g:0, glow:true }); ring(hx, hy, 4, 50, .4, '#bfe6ff'); Snd.tone(1200,.4,'triangle',.05,0,.3); break;
    case 'Jordan':
      for (let i = 0; i < 3; i++){ const ang = base + (i - 1)*.9; G.allies.push({ x:hx + Math.cos(ang)*10, y:G.y + Math.sin(ang)*6, hw:3, hh:6, life:7, cd:0, t:i*.2, dirLR:'r' }); }
      burst(hx, hy, 18, ['#ffd27a','#a7b0ba','#ffffff'], { min:20, max:70 }); Snd.seq([523,784,1047],.07); break;
    case 'Erin': {
      const h = Math.round(G.maxHp*.55); G.hp = Math.min(G.maxHp, G.hp + h); floatText(G.x, G.y - 22, '+' + h, '#7dff9a', true);
      ring(hx, hy, 6, 48, .5, '#ff8fb1'); burst(hx, hy, 30, ['#ff8fb1','#ffffff','#e889b4'], { min:20, max:90, g:-30, glow:true });
      for (const e of G.enemies) if (e.alive && Math.hypot(center(e).x - hx, center(e).y - hy) < 48 + e.hw) hitEnemy(e, 1.0, { kb:160 });
      Snd.heal(); break; }
    case 'Dick':
      shake(14); fx.hitstop = .08; ring(hx, G.y, 6, 44, .45, '#ffcf9a');
      burst(hx, G.y, 36, ['#8a5a2b','#c98a4b','#ffcf9a','#5e3a1c'], { min:40, max:130, up:60, size:3 });
      for (const e of G.enemies) if (e.alive && Math.hypot(center(e).x - hx, center(e).y - hy) < 42 + e.hw) hitEnemy(e, 2.3, { kb:220, crit:true });
      Snd.boom(); break;
    case 'Dawn':
      for (let i = 0; i < 7; i++) fireShot({ kind:'cookie', speed:170, r:4, life:.7, mult:1.0, color:'#c98a4b', steal:.3 }, base + (i - 3)*.2);
      Snd.shoot(); Snd.tone(700,.12,'square',.03,.06); break;
    case 'Chelsea':
      for (let i = 0; i < 5; i++) fireShot({ kind:'arrow', speed:280, r:3, life:.8, mult:1.0, color:'#ffe14d', crit:.5, pierce:true }, base + (i - 2)*.12);
      Snd.seq([1319,1568,1760],.05); break;
    case 'Jake':
      fireShot({ kind:'bigsnow', speed:120, r:9, life:1.7, mult:1.7, color:'#ffffff', pierce:true, armor:true, weaken:true }, base);

}
function hurtHero(atk, sx, sy){
  if (G.inv > 0 || mode !== 'play') return;
  const d = Math.hypot(G.x - sx, G.y - sy) || 1;
  if (Math.random() < G.spd*.012){ G.inv = .45; floatText(G.x, G.y - 20, 'DODGE!', '#bfe6ff'); Snd.blip(); return; }
  const n = Math.max(1, Math.round(atk*rand(.85,1.15) - G.def*.6));
  G.hp -= n; G.inv = .9; G.kbx = (G.x - sx)/d*150; G.kby = (G.y - sy)/d*150;
  shake(6); fx.redFlash = .25; fx.hitstop = .05; Snd.hurt();
  floatText(G.x, G.y - 20, '-' + n, '#ff5a5a', true); burst(G.x, G.y - 8, 10, ['#ff5a5a','#ffffff'], { min:20, max:70 });
  if (G.hp <= 0) heroDown();
}
function heroDown(){
  G.hp = 0; mode = 'dead'; Snd.lose(); burst(G.x, G.y - 8, 40, ['#ffffff','#f2c14e','#ff8fb1'], { min:20, max:100, g:-20, glow:true, life:1.2 });
  setTimeout(respawn, 1500);
}
function respawn(){
  if (G.p.mrs){ G.lives -= 1; if (G.lives <= 0){ mrsGameOver(); return; } }
  else { G.spirit += 1; G.atk += 1; G.maxHp += 5; }
  G.hp = G.maxHp; G.sp = G.spMax; G.x = G.cp.x; G.y = G.cp.y; G.vx = G.vy = G.kbx = G.kby = 0; G.inv = 1.6;
  G.shots = []; G.eshots = []; G.hazards = []; G.allies = []; G.swing = null;
  G.enemies = G.enemies.filter(e => !e.minion);
  for (const e of G.enemies){ if (!e.alive) continue; e.x = e.sx; e.y = e.sy; e.hp = e.maxHp; e.kbx = e.kby = 0; e.frozen = 0; e.stun = 0; e.aggro = false; e.state = 'idle'; e.st = 0; e.z = 0; e.air = false;
    if (e.boss){ e.active = false; e.summoned = false; e.enraged = false; e.alpha = 1; e.dashing = false; e.cd = 1.2; } }
  hideBossBar(); fx.fade = 1; fx.fadeDir = -1;
  if (G.p.mrs){ banner(G.lives + (G.lives === 1 ? ' LIFE LEFT' : ' LIVES LEFT'), 'Back to the last fireplace', 2200); mrsSave(); }
  else banner('TRY AGAIN!', 'Christmas spirit +1 · Power +1 · Max HP +5', 2200);
  mode = 'play';
}

/* ---------- Combat ---------- */
function hitEnemy(e, mult, o={}){
  if (!e.alive || e.air || e.state === 'vanish') return 0;
  const crit = o.crit === true || (o.crit !== false && Math.random() < .08 + G.spd*.006 + (o.critBonus || 0));
  const n = dmgCalc(G.atk, mult*(crit ? 1.6 : 1), e.def*(o.defMul ?? 1), !!o.armor);
  e.hp -= n; e.flash = .12;
  const c = center(e); let dx = c.x - G.x, dy = c.y - (G.y - 6); if (o.dir){ dx = o.dir.x; dy = o.dir.y; }
  const d = Math.hypot(dx, dy) || 1, kb = (o.kb ?? 110)*(e.boss ? .12 : 1);

function drawWeather(kind, n, ox, oy){
  if (kind === 'snow'){ drawSnow(n, ox, oy); return; }
  if (kind === 'none' || !n) return;
  const W = cv.width, H = cv.height;
  for (let i = 0; i < n; i++){ const k = flakes[i];
    let x = ((k.x*W - ox*(.3 + k.z*.5)) % W + W) % W, y;
    if (kind === 'embers'){ y = (1 - ((k.y + T*.0006*k.s) % 1))*H; ctx.globalAlpha = .25 + k.z*.3; px(x, y, 3, 3, '#ffb070'); continue; }
    const fall = kind === 'dust' ? .00012 : kind === 'ash' ? .0005 : .0009;
    y = (((k.y + T*fall*(.5 + k.s)) % 1)*H - oy*(.3 + k.z*.5)) % H; if (y < 0) y += H;

    else if (kind === 'ash'){ ctx.globalAlpha = .25 + k.z*.3; px(x, y, 3, 3, '#8a8a8a'); }

    else if (kind === 'petals'){ ctx.globalAlpha = .5; px(x, y, 4, 3, i % 3 ? '#ff8fb1' : '#ffffff'); }
  }
  ctx.globalAlpha = 1;
}

function enemyUpdate(e, dt){
  if (!e.alive) return;
  e.t += dt; e.flash = Math.max(0, e.flash - dt);
  const d = MON[e.type], who = d.fly ? 'fly' : 'walk';
  if (e.boss && !e.active && distHero(e) < 104) activateBoss(e);
  if (e.frozen > 0) e.frozen -= dt;
  else if (e.stun > 0) e.stun -= dt;
  else AI[d.ai](e, dt*e.rate, d);
  if (e.kbx || e.kby){ const r = moveBody(e, e.kbx*dt, e.kby*dt, who); if (r.hx) e.kbx = 0; if (r.hy) e.kby = 0; const kd = Math.exp(-9*dt); e.kbx *= kd; e.kby *= kd; if (Math.abs(e.kbx) + Math.abs(e.kby) < 2) e.kbx = e.kby = 0; }
  if (!e.air && e.state !== 'vanish' && e.frozen <= 0 && mode === 'play' && overlap(e, G)) hurtHero((e.atk - (e.weak ? 2 : 0))*(e.dashing ? 1.6 : 1), e.x, e.y - e.hh/2);
}
function shotsUpdate(dt){
  for (const s of G.shots){
    s.t += dt; s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.kind === 'bigsnow' && Math.random() < .5) burst(s.x, s.y + 4, 1, ['#ffffff','#dff3ff'], { min:5, max:20, g:-10, life:.4 });
    if (s.t > s.life || solidTile(tileAt(Math.floor(s.x/TS), Math.floor(s.y/TS)), 'shot')){ s.dead = true; burst(s.x, s.y, 5, [s.color, '#ffffff'], { min:15, max:50 }); continue; }
    for (const e of G.enemies){
      if (!e.alive || e.air || s.hit.has(e)) continue; const c = center(e);
      if (Math.abs(c.x - s.x) < e.hw + s.r && Math.abs(c.y - s.y) < e.hh/2 + s.r){
        s.hit.add(e);
        const n = hitEnemy(e, s.mult, { freeze:s.freeze, weaken:s.weaken, armor:s.armor, critBonus:s.crit, kb:s.kind === 'bigsnow' ? 160 : 90, dir:{ x:s.vx, y:s.vy } });
        if (s.steal && n){ const h = Math.max(1, Math.ceil(n*s.steal)); G.hp = Math.min(G.maxHp, G.hp + h); }
        if (!s.pierce){ s.dead = true; break; }
      }
    }
  }
  G.shots = G.shots.filter(s => !s.dead);
  for (const s of G.eshots){
    if (s.home > 0){ s.home -= dt; const cur = Math.atan2(s.vy, s.vx); let dd = Math.atan2((G.y - 6) - s.y, G.x - s.x) - cur;
      while (dd > Math.PI) dd -= Math.PI*2; while (dd < -Math.PI) dd += Math.PI*2; const na = cur + clamp(dd, -s.turn*dt, s.turn*dt), sp = Math.hypot(s.vx, s.vy); s.vx = Math.cos(na)*sp; s.vy = Math.sin(na)*sp; }
    s.t += dt; s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.t > s.life || solidTile(tileAt(Math.floor(s.x/TS), Math.floor(s.y/TS)), 'shot')){ s.dead = true; burst(s.x, s.y, 4, ['#ffffff', '#888'], { min:10, max:40 }); continue; }
    if (mode === 'play' && Math.abs(s.x - G.x) < G.hw + s.r - 1 && s.y > G.y - G.hh - s.r && s.y < G.y + s.r - 2){ s.dead = true; hurtHero(s.atk, s.x - s.vx*.05, s.y - s.vy*.05); }
  }
  G.eshots = G.eshots.filter(s => !s.dead);
  for (const h of G.hazards){
    h.t += dt;
    if (h.t >= h.delay){ h.dead = true; shake(7); Snd.boom(); ring(h.x, h.y, 4, h.r + 6, .35, '#ffe14d');
      burst(h.x, h.y, 26, [h.col || '#d63a3a', '#ffe14d', '#ffffff', '#ff8a1f'], { min:30, max:120, up:30, glow:true });
      if (Math.hypot(G.x - h.x, G.y - 4 - h.y) < h.r + 5) hurtHero(h.atk, h.x, h.y); }
  }
  G.hazards = G.hazards.filter(h => !h.dead);
  // wind-up robots
  for (const a of G.allies){
    a.life -= dt; a.t += dt; a.cd -= dt;
    let best = null, bd = 1e9; for (const e of G.enemies){ if (!e.alive || e.air) continue; const dd = Math.hypot(e.x - a.x, e.y - a.y); if (dd < bd){ bd = dd; best = e; } }
    if (best && bd < 160){ const c = center(best), ang = Math.atan2(c.y - (a.y - 3), c.x - a.x);
      if (bd > best.hw + 6) { moveBody(a, Math.cos(ang)*82*dt, Math.sin(ang)*82*dt, 'walk'); a.dirLR = Math.cos(ang) > 0 ? 'r' : 'l'; }
      else if (a.cd <= 0){ a.cd = .45; hitEnemy(best, .8, { defMul:.5, kb:70, crit:false }); } }
    if (a.life <= 0) burst(a.x, a.y - 4, 10, ['#a7b0ba','#ffd27a','#ffffff'], { min:10, max:50 });
  }
  G.allies = G.allies.filter(a => a.life > 0);
  // melee swing
  const sw = G.swing;
  if (sw){
    sw.t += dt; const hx = G.x, hy = G.y - 6;
    for (const e of G.enemies){
      if (!e.alive || e.air || sw.hit.has(e)) continue; const c = center(e), dx = c.x - hx, dy = c.y - hy, d = Math.hypot(dx, dy);
      if (d < sw.range + e.hw && (sw.arc >= Math.PI*2 - .01 || angDiff(Math.atan2(dy, dx), sw.ang) < sw.arc/2 + .2)){ sw.hit.add(e); hitEnemy(e, sw.mult, { kb:sw.kb, crit:sw.spin ? undefined : undefined }); }
    }
    if (sw.t >= sw.dur) G.swing = null;
  }
}
function effectsUpdate(dt){

function buildLayer(){
  const f = FLOORS[G.floor], th = THEMES[f.theme], gw = G.grid[0].length, gh = G.grid.length;
  const c = document.createElement('canvas'); c.width = gw*TS; c.height = gh*TS; const x = c.getContext('2d');
  const P = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  const isWall = (gx, gy) => tileAt(gx, gy) === '#';
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++){
    const t = G.grid[gy][gx], sx = gx*TS, sy = gy*TS, h = hash(gx, gy);
    if (t === '#'){
      const open = !isWall(gx, gy + 1) && gy + 1 < gh;
      P(sx, sy, 16, 16, th.top);
      // roof texture
      if (th.tex === 'planks'){ P(sx, sy + (gx % 2 ? 3 : 9), 16, 1, th.face2); if (h % 3 === 0) P(sx + 4 + h % 7, sy + 5, 3, 1, '#4f8e5c'); }
      else if (th.tex === 'speckle'){ P(sx + h % 11, sy + (h >> 5) % 11, 3, 2, th.face2); P(sx + (h >> 7) % 13, sy + (h >> 9) % 13, 2, 1, th.face); }
      else { P(sx + 1, sy + 1, 6, 6, th.face2); P(sx + 9, sy + 9, 6, 6, th.face2); P(sx + 2, sy + 2, 2, 1, th.trim); }
      if (open){ // the wall's front face
        P(sx, sy + 7, 16, 9, th.face);
        if (th.tex === 'planks'){ P(sx, sy + 7, 16, 1, th.trim); P(sx, sy + 11, 16, 1, th.face2); P(sx + (gx % 2 ? 3 : 10), sy + 8, 1, 3, th.face2); P(sx + (gx % 2 ? 8 : 4), sy + 12, 1, 4, th.face2);
          if (h % 4 === 0 && f.theme === 'workshop'){ P(sx + 6, sy + 8, 4, 3, '#d63a3a'); P(sx + 7, sy + 8, 2, 3, '#f2c14e'); } }
        else if (th.tex === 'speckle'){ P(sx, sy + 7, 16, 2, th.trim); for (let i = 0; i < 16; i += 3) P(sx + i, sy + 9, 2, 1 + (hash(gx*16 + i, gy) % 4), th.trim); P(sx, sy + 14, 16, 2, th.face2); }
        else { P(sx, sy + 7, 16, 1, th.trim); P(sx + 2 + h % 9, sy + 9, 1, 5, '#5a7ec0'); P(sx + 1 + (h >> 4) % 12, sy + 10, 2, 1, '#bfe6ff'); P(sx, sy + 15, 16, 1, th.face2); }
      }
      continue;
    }
    if (t === '~' || t === '_' || t === '=') { if (t === '_') P(sx, sy, 16, 16, '#cdeefd'); continue; }
    // floor
    P(sx, sy, 16, 16, th.floor);
    if (th.tex === 'planks'){ P(sx, sy + 7, 16, 1, th.floor2); P(sx, sy + 15, 16, 1, th.floor2); P(sx + (gy % 2 ? 4 : 11), sy, 1, 7, th.floor2); P(sx + (gy % 2 ? 9 : 2), sy + 8, 1, 7, th.floor2);
      P(sx + 1 + h % 12, sy + 2 + (h >> 4) % 4, 2, 1, th.floor3); if (h % 9 === 0) P(sx + 5, sy + 11, 1, 1, th.face2); }
    else if (th.tex === 'speckle'){ P(sx + (h % 12) + 2, sy + ((h >> 4) % 12) + 2, 2, 2, th.floor2); P(sx + ((h >> 8) % 12) + 1, sy + ((h >> 12) % 12) + 1, 1, 1, th.floor2);
      P(sx + ((h >> 3) % 13), sy + ((h >> 6) % 13), 2, 1, th.floor3); if (h % 7 === 0){ P(sx + 6, sy + 6, 2, 2, f.theme === 'caverns' ? '#ff8fb1' : th.trim); } }
    else { P(sx, sy, 16, 1, th.floor2); P(sx, sy, 1, 16, th.floor2); P(sx + 1, sy + 1, 15, 1, th.floor3); if (h % 5 === 0) P(sx + 5, sy + 5, 2, 1, '#c8dcef'); }

          for (let i = 0; i < 13; i += 3) P(sx + 6, sy + 3 + i, 4, 1, '#d63a3a'); P(sx + 11, sy + 5, 3, 1, '#d63a3a'); P(sx + 9, sy + 3, 1, 12, 'rgba(0,0,0,.15)'); }
        else { const gc = v === 1 ? '#d63a3a' : '#8a4fd1'; P(sx + 3, sy + 7, 10, 8, '#1a1c2c'); P(sx + 4, sy + 6, 8, 8, gc); P(sx + 5, sy + 5, 6, 2, gc); P(sx + 6, sy + 7, 2, 1, '#fff'); P(sx + 4, sy + 12, 8, 2, 'rgba(0,0,0,.25)');

  for (const s of [...G.shots, ...G.eshots]){ const [sx, sy] = S2(s.x, s.y); const col = s.kind === 'orb' ? glowOf(s.col) : s.kind === 'ember' || s.kind === 'coal' ? 'rgba(255,120,40,A)' : s.kind === 'holly' ? 'rgba(90,220,110,A)' : s.kind === 'cookie' || s.kind === 'walnut' || s.kind === 'crumb' ? 'rgba(255,190,120,A)' : 'rgba(150,210,255,A)'; addGlow(sx, sy, 10*SC, col, .35); }
  for (const p of G.parts) if (p.glow){ const [sx, sy] = S2(p.x, p.y); addGlow(sx, sy, 5*SC, 'rgba(255,220,150,A)', .25*(1 - p.t/p.life)); }
  for (const e of G.enemies) if (e.alive && e.type === 'santa'){
    const s = e.sc, img = monSprites.santa.r, ox = e.x - img.width*s/2, oy = e.y - img.height*s - e.z + 1;
    for (const ex of [12.5, 17.5]){ const [sx, sy] = S2(e.dirLR === 'r' ? ox + (img.width - ex)*s : ox + ex*s, oy + 9.5*s); addGlow(sx, sy, 4*SC, 'rgba(255,220,60,A)', e.hp < e.maxHp/2 ? .55 : .35); }
  }
  ctx.restore();
  // floating numbers
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const t of G.texts){ const p = t.t/t.dur, [sx, sy] = S2(t.x, t.y - p*14 - (t.big ? Math.sin(Math.min(1, p*4)*Math.PI)*3 : 0));
    ctx.globalAlpha = p > .7 ? (1 - p)/.3 : 1; ctx.font = `${t.big ? 18 : 13}px "Press Start 2P", monospace`;
    ctx.lineWidth = 5; ctx.strokeStyle = '#120a14'; ctx.strokeText(t.text, sx, sy); ctx.fillStyle = t.color; ctx.fillText(t.text, sx, sy); }
  ctx.globalAlpha = 1;
  drawWeather(th.weather[0], th.weather[1], cx*SC, cy*SC);
}
function renderOverlay(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!vignette){ vignette = ctx.createRadialGradient(cv.width/2, cv.height/2, cv.height*.35, cv.width/2, cv.height/2, cv.height*.78); vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,.55)'); }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, cv.width, cv.height);
  if (G && G.hp < G.maxHp*.3 && mode === 'play'){ ctx.globalAlpha = .18 + .12*Math.sin(T/6); ctx.fillStyle = '#ff1a2a'; ctx.fillRect(0, 0, cv.width, 8); ctx.fillRect(0, cv.height - 8, cv.width, 8); ctx.fillRect(0, 0, 8, cv.height); ctx.fillRect(cv.width - 8, 0, 8, cv.height); ctx.globalAlpha = 1; }
  if (fx.redFlash > 0){ ctx.globalAlpha = fx.redFlash*.6; px(0, 0, cv.width, cv.height, '#ff1a2a'); ctx.globalAlpha = 1; }
  if (fx.fade > 0){ ctx.globalAlpha = Math.min(1, fx.fade); px(0, 0, cv.width, cv.height, '#000'); ctx.globalAlpha = 1; }
}
let last = 0;
function frame(now){
  const raw = Math.min(.05, Math.max(0, (now - last)/1000 || 0)); last = now; T++;
  let dt = raw;
  if (fx.slow > 0){ fx.slow -= raw; dt *= .35; }
  if (fx.fadeDir){ fx.fade += fx.fadeDir*raw*2.4; if (fx.fade <= 0){ fx.fade = 0; fx.fadeDir = 0; } if (fx.fade >= 1){ fx.fade = 1; } }
  fx.redFlash = Math.max(0, fx.redFlash - raw*2);
  if (G && G.grid && mode !== 'title'){
    if (fx.hitstop > 0) fx.hitstop -= raw;
    else {
      G.time += dt;
      if (mode === 'play') heroUpdate(dt); else { btn.spQueued = btn.cocoaQueued = false; }
      if (mode === 'play' || mode === 'done' || mode === 'dead') { for (const e of G.enemies) enemyUpdate(e, mode === 'play' ? dt : 0); shotsUpdate(mode === 'play' ? dt : 0); }
      effectsUpdate(dt);
      if (G.boss && G.boss.alive && G.boss.active) bossFill.style.width = Math.max(0, G.boss.hp/G.boss.maxHp*100) + '%';
      updateHud();
    }
    fx.shake = Math.max(0, fx.shake - raw*30);
    renderWorld();
  } else {
    ctx.setTransform(1, 0, 0, 1, 0, 0); px(0, 0, cv.width, cv.height, '#0d1b2a'); drawSnow(50, 0, 0);
  }
  renderOverlay();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
loadTitle();
</script>
